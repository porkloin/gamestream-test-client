name: image

# Weekly too, so the image picks up Arch's security updates.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: podman build --build-arg GTC_COMMIT=${GITHUB_SHA::7} -t ghcr.io/${{ github.repository }}:latest -t ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7} .

      - name: Smoke test
        run: podman run --rm ghcr.io/${{ github.repository }}:latest --version

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/${{ github.repository }}:latest
          podman push ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}
